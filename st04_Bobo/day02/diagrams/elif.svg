<svg xmlns="http://www.w3.org/2000/svg" width="660" height="365" viewBox="0 0 660 365" role="img" aria-labelledby="title">
  <title id="title">първо условие, което да бъде проверено</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#176b80"/></marker></defs>
  <rect width="100%" height="100%" rx="10" fill="#f3f7f9"/>
  <text x="20" y="26" font-family="Arial, sans-serif" font-size="16" fill="#204b5a" xml:space="preserve">първо условие, което да бъде проверено</text>
  <path d="M88 37 L88 65" stroke="#176b80" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="20" y="89" font-family="Consolas, monospace" font-size="17" fill="#172b40" xml:space="preserve">if *условие* :</text>
  <text x="20" y="125" font-family="Consolas, monospace" font-size="17" fill="#172b40" xml:space="preserve">    *код*</text>
  <text x="20" y="161" font-family="Consolas, monospace" font-size="17" fill="#172b40" xml:space="preserve">    *код*</text>
  <path d="M220 155 L123 155" stroke="#176b80" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="232" y="161" font-family="Arial, sans-serif" font-size="16" fill="#204b5a" xml:space="preserve">код, който да се изпълни, само ако условието</text>
  <text x="232" y="181" font-family="Arial, sans-serif" font-size="16" fill="#204b5a" xml:space="preserve">е вярно</text>
  <text x="20" y="197" font-family="Consolas, monospace" font-size="17" fill="#172b40" xml:space="preserve">    *код*</text>
  <text x="20" y="233" font-family="Consolas, monospace" font-size="17" fill="#172b40" xml:space="preserve">elif *условие* :</text>
  <path d="M220 227 L187 227" stroke="#176b80" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="232" y="233" font-family="Arial, sans-serif" font-size="16" fill="#204b5a" xml:space="preserve">второ условие, което да бъде проверено</text>
  <text x="20" y="269" font-family="Consolas, monospace" font-size="17" fill="#172b40" xml:space="preserve">    *код*</text>
  <text x="20" y="305" font-family="Consolas, monospace" font-size="17" fill="#172b40" xml:space="preserve">    *код*</text>
  <path d="M220 299 L123 299" stroke="#176b80" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="232" y="305" font-family="Arial, sans-serif" font-size="16" fill="#204b5a" xml:space="preserve">код, който да се изпълни, само ако първото</text>
  <text x="232" y="325" font-family="Arial, sans-serif" font-size="16" fill="#204b5a" xml:space="preserve">условие НЕ Е вярно, а второто е</text>
  <text x="20" y="341" font-family="Consolas, monospace" font-size="17" fill="#172b40" xml:space="preserve">    *код*</text>
</svg>
