<svg xmlns="http://www.w3.org/2000/svg" width="660" height="221" viewBox="0 0 660 221" role="img" aria-labelledby="title">
  <title id="title">условие, което да бъде проверено</title>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#176b80"/></marker></defs>
  <rect width="100%" height="100%" rx="10" fill="#f3f7f9"/>
  <text x="20" y="26" font-family="Arial, sans-serif" font-size="16" fill="#204b5a" xml:space="preserve">условие, което да бъде проверено</text>
  <path d="M88 37 L88 65" stroke="#176b80" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="20" y="89" font-family="Consolas, monospace" font-size="17" fill="#172b40" xml:space="preserve">if *условие* :</text>
  <text x="20" y="125" font-family="Consolas, monospace" font-size="17" fill="#172b40" xml:space="preserve">    *код*</text>
  <text x="20" y="161" font-family="Consolas, monospace" font-size="17" fill="#172b40" xml:space="preserve">    *код*</text>
  <path d="M220 155 L123 155" stroke="#176b80" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="232" y="161" font-family="Arial, sans-serif" font-size="16" fill="#204b5a" xml:space="preserve">код, който да се изпълни само ако условието е</text>
  <text x="232" y="181" font-family="Arial, sans-serif" font-size="16" fill="#204b5a" xml:space="preserve">вярно</text>
  <text x="20" y="197" font-family="Consolas, monospace" font-size="17" fill="#172b40" xml:space="preserve">    *код*</text>
</svg>
